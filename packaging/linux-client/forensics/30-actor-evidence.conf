[Service]
# Required for /proc/PID/exe across users and read-only access to protected actor images.
# Keep the existing unprivileged service account, NoNewPrivileges and filesystem sandbox.
# Assignments add these capabilities to any explicitly configured fanotify capabilities.
CapabilityBoundingSet=CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
AmbientCapabilities=CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
